behaviors:
  CompanionBehavior:          # Unity'deki Behavior Name ile BİREBİR aynı
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240      # batch_size'ın 10 katı
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      # Ajan 300-500k adım sonra küpe bile ulaşamıyorsa şu 4 satırın başındaki # işaretini kaldır:
      # curiosity:
      #   gamma: 0.99
      #   strength: 0.02
      #   learning_rate: 0.0003
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 200000
